<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Splitter</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body>

<div class="container">
    <h2 class="title">SPLITTER</h2>

    <div class="card">

        <div class="left">

            <label>Bill</label>
            <input type="number" id="bill" placeholder="0.00">

            <label>Select Tip %</label>
            <div class="buttons">
                <button class="tip-btn" data-tip="5">5%</button>
                <button class="tip-btn" data-tip="10">10%</button>
                <button class="tip-btn" data-tip="15">15%</button>
                <button class="tip-btn" data-tip="25">25%</button>
                <button class="tip-btn" data-tip="50">50%</button>
                <input type="number" id="customTip" placeholder="Custom">
            </div>

            <label>Number of People</label>
            <input type="number" id="people" value="1" min="1">

        </div>

        <div class="right">

            <div class="result">
                <div>
                    <p>Tip Amount</p>
                    <span>/ person</span>
                </div>
                <h3 id="tipPerPerson">$0.00</h3>
            </div>

            <div class="result">
                <div>
                    <p>Total</p>
                    <span>/ person</span>
                </div>
                <h3 id="totalPerPerson">$0.00</h3>
            </div>

            <button id="reset">RESET</button>

        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
